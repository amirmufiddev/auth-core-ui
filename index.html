<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AuthCore — Better Auth Service Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("authcore-theme") || "light";
          var isDark =
            stored === "dark" ||
            (stored === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (isDark) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
          var prefsRaw = localStorage.getItem("authcore-theme-prefs");
          var colorTheme = "indigo";
          if (prefsRaw) {
            var prefs = JSON.parse(prefsRaw);
            if (typeof prefs.radius === "number") {
              document.documentElement.style.setProperty("--radius", prefs.radius + "rem");
            }
            if (typeof prefs.colorTheme === "string") {
              var legacyMap = {
                blue: "ocean",
                red: "rose",
                orange: "amber",
                yellow: "amber",
                zinc: "slate",
                stone: "slate",
                gray: "slate",
                neutral: "slate"
              };
              colorTheme = legacyMap[prefs.colorTheme] || prefs.colorTheme;
            }
          }
          document.documentElement.setAttribute("data-color-theme", colorTheme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
